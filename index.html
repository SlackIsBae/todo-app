<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Todo</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;background:linear-gradient(135deg,#a78bfa 0%,#6366f1 45%,#38bdf8 100%);background-attachment:fixed;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:flex;justify-content:center;padding:48px 14px;color:#1f2937}
main{width:100%;max-width:500px;background:#fff;border-radius:20px;box-shadow:0 20px 50px rgba(30,27,75,.3);padding:28px;align-self:flex-start}
h1{margin:0 0 20px;font-size:1.7rem;letter-spacing:-.02em}
form{display:flex;gap:10px}
input[type=text]{flex:1;min-width:0;padding:12px 14px;border:2px solid #e5e7eb;border-radius:12px;font-size:1rem;transition:border-color .2s,box-shadow .2s}
input[type=text]:focus{outline:0;border-color:#6366f1;box-shadow:0 0 0 4px rgba(99,102,241,.2)}
button{padding:12px 18px;border:0;border-radius:12px;background:#6366f1;color:#fff;font-size:1rem;font-weight:600;cursor:pointer;transition:background .2s,transform .1s}
button:hover{background:#4f46e5}
button:active{transform:scale(.96)}
button:focus-visible,input[type=checkbox]:focus-visible{outline:3px solid #a5b4fc;outline-offset:2px}
ul{list-style:none;margin:18px 0 0;padding:0}
li{display:flex;align-items:center;gap:12px;padding:12px 10px;border-radius:12px;transition:background .2s;animation:in .25s ease-out}
li:hover{background:#f5f3ff}
li.out{animation:out .2s ease-in forwards}
li span{flex:1;word-break:break-word;transition:color .2s}
li.done span{text-decoration:line-through;color:#9ca3af}
li button{background:transparent;color:#ef4444;padding:4px 10px;font-size:1.2rem;line-height:1;opacity:0;transition:opacity .2s,background .2s}
li:hover button,li button:focus-visible{opacity:1}
li button:hover{background:#fee2e2}
@media(hover:none){li button{opacity:1}}
input[type=checkbox]{appearance:none;-webkit-appearance:none;flex:none;width:22px;height:22px;margin:0;border:2px solid #c7d2fe;border-radius:50%;cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
input[type=checkbox]:hover{border-color:#6366f1}
input[type=checkbox]::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) scale(0);margin-top:-2px;transition:transform .15s}
input[type=checkbox]:checked{background:#6366f1;border-color:#6366f1}
input[type=checkbox]:checked::after{transform:rotate(45deg) scale(1)}
.empty{text-align:center;color:#9ca3af;padding:28px 0 12px}
.empty b{display:block;font-size:2rem;margin-bottom:6px}
footer{display:flex;justify-content:space-between;align-items:center;margin-top:14px;color:#6b7280;font-size:.9rem}
#clear{background:transparent;color:#6366f1;padding:6px 10px;font-size:.9rem}
#clear:hover{background:#eef2ff}
@keyframes in{from{opacity:0;transform:translateY(-8px)}}
@keyframes out{to{opacity:0;transform:translateX(24px)}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<h1>✅ My Todos</h1>
<form id="f"><input type="text" id="t" placeholder="What needs doing?" autocomplete="off" aria-label="New todo"><button>Add</button></form>
<ul id="list"></ul>
<footer><span id="count"></span><button type="button" id="clear">Clear completed</button></footer>
</main>
<script>
var KEY="todos",tasks=[];
try{tasks=JSON.parse(localStorage.getItem(KEY))||[]}catch(e){}
var list=document.getElementById("list"),input=document.getElementById("t"),count=document.getElementById("count"),clear=document.getElementById("clear");
function save(){localStorage.setItem(KEY,JSON.stringify(tasks))}
function render(){
  list.innerHTML="";
  if(!tasks.length){
    var e=document.createElement("li");e.className="empty";e.style.display="block";
    e.innerHTML="<b>🌱</b>Nothing here yet. Add your first todo!";
    list.appendChild(e);
  }
  tasks.forEach(function(k,i){
    var li=document.createElement("li");if(k.done)li.className="done";
    var c=document.createElement("input");c.type="checkbox";c.checked=k.done;
    c.setAttribute("aria-label","Done: "+k.text);
    c.onchange=function(){k.done=c.checked;save();render()};
    var s=document.createElement("span");s.textContent=k.text;
    var d=document.createElement("button");d.textContent="✕";d.setAttribute("aria-label","Delete "+k.text);
    d.onclick=function(){
      li.classList.add("out");
      setTimeout(function(){tasks.splice(tasks.indexOf(k),1);save();render()},matchMedia("(prefers-reduced-motion:reduce)").matches?0:200);
    };
    li.append(c,s,d);list.appendChild(li);
  });
  var n=tasks.filter(function(k){return !k.done}).length;
  count.textContent=n+(n===1?" item":" items")+" left";
  clear.hidden=n===tasks.length;
}
clear.onclick=function(){tasks=tasks.filter(function(k){return !k.done});save();render()};
document.getElementById("f").onsubmit=function(e){
  e.preventDefault();
  var v=input.value.trim();if(!v)return;
  tasks.push({text:v,done:false});input.value="";save();render();
};
render();
</script>
</body>
</html>
